name: Feature / 功能建议
description: 提出具有明确场景和验收条件的改进。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 Issue；相同需求请在原记录补充场景。
  - type: textarea
    id: context
    attributes:
      label: 使用场景与问题
      description: 谁在什么情境下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望效果
      description: 描述完成后能够怎样使用；有必要时附示意图或参考。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: 列出本次包含的内容及明确留待后续的事项。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 写出能逐项核对的行为、页面状态或结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与关联记录
      description: 可补充已有办法、依赖或相关 Issue。
