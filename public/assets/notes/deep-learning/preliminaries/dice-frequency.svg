<svg xmlns="http://www.w3.org/2000/svg" width="448" height="254" viewBox="0 0 448 254" role="img" aria-labelledby="title description">
  <title id="title">掷出 3 点的累计频率</title>
  <desc id="description">沿横轴从 10 次投掷累积到 5000 次，每 10 次记录一个频率点。实线是一次 PyTorch 样本的累计频率，虚线是公平骰子的真实概率 1/6。最终观察到 829 次 3 点。</desc>
  <style>
    :root {
      --ink: #243b49;
      --muted: #4e6374;
      --grid: #bbc9d5;
      --axis: #557082;
      --curve: #246899;
      --reference: #137068;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #d3dfe5;
        --muted: #adbcc7;
        --grid: #394b59;
        --axis: #8196a7;
        --curve: #8ec7eb;
        --reference: #7cc6b8;
      }
    }
    text { font: 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: var(--ink); dominant-baseline: middle; }
    .tick { fill: var(--muted); font-variant-numeric: tabular-nums; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { fill: none; stroke: var(--axis); stroke-width: 1.15; }
    .reference { stroke: var(--reference); stroke-width: 1.6; stroke-dasharray: 6 4; }
    .curve { fill: none; stroke: var(--curve); stroke-width: 2.15; stroke-linecap: round; stroke-linejoin: round; }
    .endpoint { fill: var(--curve); }
  </style>
